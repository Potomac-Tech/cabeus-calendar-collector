name: Launch Library collector

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ll2-calendar-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out collector
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: scripts/ll2-github-collector.mjs
          sparse-checkout-cone-mode: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Collect approved Launch Library pages
        env:
          CABEUS_LL2_COLLECTOR_TOKEN: ${{ secrets.CABEUS_LL2_COLLECTOR_TOKEN }}
        run: node scripts/ll2-github-collector.mjs
